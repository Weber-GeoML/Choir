name: verify-decide-instance

# Phase 3 audit: catch PRs that introduce new Decidable instances or
# pull in Classical.* helpers (choice, propDecidable, byContradiction,
# decEq). Per AGENTS.md non-negotiable, these block merge until human-
# reviewed.
#
# Sibling to verify-axiom-honesty; same shape. See
# gate/verify/decide_instance.py for the v0 caveat (regex-based;
# multi-line instance declarations and type-expression references are
# known false-positive / false-negative sources).
#
# Posts its own required status check: `verify-decide-instance / decide-instance`.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: choir-verify-decide-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decide-instance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --extra dev

      - name: Run decide-instance audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python -m gate.verify.decide_instance_cli \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}"
