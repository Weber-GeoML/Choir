name: issue-intake

# Thin glue around gate.state.intake_cli. The CLI parses the issue
# body and emits a JSON payload; this workflow applies the resulting comment
# and label changes via `gh`.

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  issues: write
  contents: read

concurrency:
  group: choir-intake-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  intake:
    # Only react to issues that are either (a) being onboarded as Choir tasks
    # (`choir/available`) or (b) in an invalid state being retried
    # (`choir/invalid`). Filter out events generated by this workflow's own
    # label edits to avoid recursion.
    #
    # On a `labeled` event, act only when the label just added is one of
    # those two. Asking only whether the issue *carries* them is true for
    # every later label as well, so `choir/priority:*` and
    # `choir/difficulty:*` each started a second run — which read the
    # comment list before the first had posted its acknowledgement, found
    # no marker, and posted again. One run per issue leaves that race no
    # second runner.
    if: |
      github.event.sender.login != 'github-actions[bot]' &&
      (github.event.action != 'labeled' ||
       github.event.label.name == 'choir/available' ||
       github.event.label.name == 'choir/invalid') &&
      (contains(github.event.issue.labels.*.name, 'choir/available') ||
       contains(github.event.issue.labels.*.name, 'choir/invalid'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --extra dev

      - name: Save issue body to a file
        # Pass the body through an env var rather than substituting it into
        # a script — `${{ github.event.issue.body }}` can contain quotes,
        # backticks, and shell metacharacters that would break inline use.
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p .intake-tmp
          printf '%s' "$BODY" > .intake-tmp/body.txt

      - name: Fetch prior comments for idempotency check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          # One comment body per line. The CLI scans them for prior
          # `choir-intake-ack:<hash>` markers; if the marker for the
          # current canonical record is already present, the comment
          # post is skipped (labels are still applied — idempotent).
          gh issue view "$ISSUE_NUMBER" --repo "$REPO" \
            --json comments \
            --jq '.comments[].body' \
            > .intake-tmp/existing-comments.txt || echo "" > .intake-tmp/existing-comments.txt

      - name: Validate issue body
        # No --prover flag: the CLI reads the prover from this checkout's
        # .choir/project.toml (default branch — issues have no base SHA),
        # per design note 12 §5.
        run: |
          uv run python -m gate.state.intake_cli \
            --body-file .intake-tmp/body.txt \
            --repo "${{ github.repository }}" \
            --existing-comments-file .intake-tmp/existing-comments.txt \
            > .intake-tmp/result.json
          echo "--- intake result ---"
          cat .intake-tmp/result.json

      - name: Apply intake result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Skip the comment post on issues.edited events that didn't
          # change the canonical record (e.g., maintainer edited only
          # the prose, not the YAML front-matter).
          should_post=$(jq -r '.should_post_comment // true' .intake-tmp/result.json)
          if [ "$should_post" = "true" ]; then
            comment=$(jq -r .comment .intake-tmp/result.json)
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$comment"
          else
            echo "Canonical record unchanged from prior intake; skipping comment post."
          fi

          # Add labels; failures are tolerated because a label may already
          # exist (idempotent add) or may not yet be defined in the repo's
          # label set (the project-template seeds them; brand-new repos
          # may not have all five lifecycle labels yet).
          jq -r '.add_labels[]' .intake-tmp/result.json | while IFS= read -r lbl; do
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "$lbl" || true
          done

          # Remove labels; failures are tolerated because removing a label
          # that isn't present is a no-op we don't need to distinguish.
          jq -r '.remove_labels[]' .intake-tmp/result.json | while IFS= read -r lbl; do
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "$lbl" || true
          done
