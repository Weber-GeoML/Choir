[project]
name = "choir-formal"
version = "0.0.0"
description = "Open infrastructure for distributed multi-agent autoformalization in Lean 4, Isabelle, and Rocq."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [{ name = "Choir contributors" }]

dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
choir = "choir_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gate", "orchestrator", "client", "choir_cli", "viz"]
# Hatchling auto-discovers subpackages. The three packages mirror the
# three roles:
#   - gate (state, verify, reconcile, indexer) — deterministic
#     trust logic invoked from .github/workflows/
#   - orchestrator (tasks, prs, labels, metrics, project_config) —
#     toolkit for the overseer's orchestrator agent
#   - client (cli, lease, workspace, submit, backends, ...) — the
#     contributor-side `choir` CLI + library

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "PL",    # pylint
    "RUF",   # ruff-specific
]
ignore = [
    "PLR0913",  # too many arguments — judgment call, not a rule
    "PLR2004",  # magic value in comparison — fine in tests
    "PLR0911",  # too many return statements — early-return guard chains are clearer than nested ifs
    "PLR0912",  # too many branches — same reason; explicit protocol sequences read better as one function
    "RUF002",   # ambiguous Unicode in docstrings — × / – are deliberate mathematical/typographic uses
    "RUF003",   # ambiguous Unicode in comments — same
]

[tool.ruff.lint.per-file-ignores]
# Test files: magic-value comparisons are fine in assertions; bare asserts
# are the test idiom; Lean test fixtures legitimately contain Greek letters
# (α, β, etc.) that mathlib uses pervasively.
"tests/**/*.py" = ["PLR2004", "S101", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` is deselected by default: those tests shell out to a real Isabelle or
# Lean toolchain to check Choir's model of the prover's syntax against the
# prover itself. They need a local install (they skip without one), take ~45s
# of the suite's ~60s, and never run in CI, which installs no toolchain. Run
# them with `pytest -m slow` before changing anything under `gate/provers/`.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not slow",
]
markers = [
    "slow: shells out to a real prover toolchain (run with `pytest -m slow`)",
]
